# cargo-deny: advisories, licenses, duplicate deps, source provenance.
# Run via ./check, or `cargo deny check` directly.

[advisories]
version = 2
# No ignores. If one becomes necessary, record the RUSTSEC id with a reason
# and a date, so it can be revisited rather than inherited forever.
ignore = []

[licenses]
version = 2
# Exactly the licenses present in the current tree. Adding a dependency with
# anything else is a deliberate decision, so it should fail the check first.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
# comrak and ratatui pull overlapping transitive trees; duplicates are worth
# knowing about but not worth blocking a build over.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
