name: "Checks"
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    # The default depth-1 clone: nothing in the flake reads history (no
    # rev, revCount or lastModified), and nix evaluates and builds a shallow
    # checkout.
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    # Keeps what this repo builds (the crate, the check derivations, the
    # vendored dependencies) in the GitHub Actions cache between runs;
    # cache.nixos.org already serves everything else. No FlakeHub, and no
    # diagnostics sent to Determinate Systems.
    - uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-flakehub: false
        diagnostic-endpoint: ""
    # The whole suite, defined in flake.nix: fmt, clippy, the test suite (via
    # the package's check phase), typos, machete, taplo, deny and the .pi
    # extension tests. Deliberately not `nix build` — that runs the tests and
    # nothing else, which is one check out of eight.
    #
    # Each check is a separate derivation over its own fileset, so nix runs
    # them in parallel and skips the ones no file in the push could affect.
    - run: nix flake check --print-build-logs
