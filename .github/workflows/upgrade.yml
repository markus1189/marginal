name: "Flake Update"
on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

# The repository default for GITHUB_TOKEN is read-only; pushing the updated
# lock file back needs `contents`, starting the Checks workflow for it needs
# `actions`.
permissions:
  contents: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    # As in build.yml. A bump moves rustc, so most of this rebuilds anyway,
    # but the vendored crates and unchanged checks do not.
    - uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-flakehub: false
        diagnostic-endpoint: ""
    - name: configure git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
    # Gated on the full suite rather than `nix build`. nixpkgs is the only
    # input, so what this bump actually moves is rustc and clippy — and clippy
    # runs with `-D warnings` against pedantic + nursery. `nix build` does not
    # run clippy at all, so it would happily push a lock file that reddens the
    # next pull request. If the check fails the commit step never runs and the
    # old lock file stays; a broken bump is never pushed.
    #
    # Note this does not touch Cargo.lock. Rust dependencies stay pinned.
    - name: update and verify
      run: |
        nix flake update
        nix flake check --print-build-logs
    # Only an unchanged lock file is "nothing to do". This used to be
    # `git commit … && git push origin || echo "nothing to do"`, where the
    # echo also caught a failed commit and a rejected push (main moved while
    # the check ran) and turned both green.
    - name: commit and push
      id: push
      run: |
        git add flake.lock
        if git diff --cached --quiet; then
          echo "flake.lock unchanged — nothing to do"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "Flake Update"
        git push origin HEAD
        echo "pushed=true" >> "$GITHUB_OUTPUT"
    # A push made with GITHUB_TOKEN starts no workflow, so the `push:` trigger
    # of Checks never fired for these commits and main carried them with no
    # status at all. workflow_dispatch is the documented exception. The gate
    # is still `update and verify` above, which ran the same suite on the same
    # tree before anything was pushed; this puts that result on the commit.
    - name: run Checks on the pushed commit
      if: steps.push.outputs.pushed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"
